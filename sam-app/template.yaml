# ============================================================================
# learning-profile API — AWS SAM template
# API-triggered Lambdas (stateless). Stateful resources come from
# terraform/aws-app (DynamoDB, S3, SQS) and are passed via parameters.
# ============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: learning-profile API (API Gateway + Lambda handlers)

Parameters:
  DynamoDBTableName:
    Type: String
    Default: learning-profile
  FilesBucket:
    Type: String
    Default: learning-profile-files
  DataBucket:
    Type: String
    Default: learning-profile-data
  ReportQueueUrl:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: nodejs22.x
    Handler: index.lambdaHandler
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref DynamoDBTableName
        FILES_BUCKET: !Ref FilesBucket
        DATA_BUCKET: !Ref DataBucket
        REPORT_QUEUE_URL: !Ref ReportQueueUrl
        DYNAMODB_ENDPOINT: ""
        INFERENCE_FORMS: vark
        MIN_SELF_CONSENT_AGE: 18
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration: REGIONAL
      Name: learning-profile-api

  # Shared IAM role for all API handlers (DynamoDB table, S3 buckets, SQS queue).
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: learning-profile-api-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/Lookup
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/RoleStatus
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${FilesBucket}/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/*
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:learning-profile_reports
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt InferenceFunction.Arn

  # ------------------------------------------------------------------------
  # Handlers
  # ------------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/health.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /health
            Method: GET

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/auth.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /auth/register
            Method: POST
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /auth/login
            Method: POST
        Logout:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /auth/logout
            Method: POST
        Me:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /auth/me
            Method: GET
        PendingAccounts:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /auth/pending-accounts
            Method: GET

  StudentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/students.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        CreateChild:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students
            Method: POST
        ListChildren:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students
            Method: GET
        GetChild:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}
            Method: GET
        UpdateChild:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}
            Method: PATCH

  GuardianshipFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/guardianship.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        GrantGuardian:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/guardians
            Method: POST
        RevokeGuardian:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/guardians/{userId}
            Method: DELETE
        Follow:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/follow
            Method: POST
        Unfollow:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/follow
            Method: DELETE
        StudentAccount:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/accounts/{userId}/link
            Method: POST
        ListGuardians:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/guardians
            Method: GET
        ListEducators:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/educators
            Method: GET
        SearchGuardians:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users
            Method: GET

  ConsentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/consent.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        GetConsent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/consent
            Method: GET
        GrantConsent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/consent
            Method: POST

  FormsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/forms.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      # Function-level Environment REPLACES Globals (no merge) — repeat all
      # shared vars here plus the inference trigger target.
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTableName
          FILES_BUCKET: !Ref FilesBucket
          DATA_BUCKET: !Ref DataBucket
          REPORT_QUEUE_URL: !Ref ReportQueueUrl
          DYNAMODB_ENDPOINT: ""
          INFERENCE_FORMS: vark
          INFERENCE_FUNCTION_NAME: !Ref InferenceFunction
      Events:
        ListForms:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /forms
            Method: GET
        GetForm:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /forms/{formId}
            Method: GET
        SubmitForm:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/forms/{formId}/responses
            Method: POST
        GetResponses:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/forms/{formId}/responses
            Method: GET
        ListSubmissions:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/submissions
            Method: GET
        RunAssessment:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/assessments
            Method: POST
        ListAssessments:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/assessments
            Method: GET
        ListPredictions:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/predictions
            Method: GET

  ObservationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/observations.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        AddObservation:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/observations
            Method: POST
        ListObservations:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/observations
            Method: GET
        DeleteObservation:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/observations/{timestamp}
            Method: DELETE

  RecommendationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/recommendations.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        ListRecommendations:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/recommendations
            Method: GET
        ProposeRecommendation:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/recommendations
            Method: POST
        ApproveRecommendation:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/recommendations/{recoId}
            Method: PATCH
        DeleteRecommendation:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/recommendations/{recoId}
            Method: DELETE

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/reports.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        GenerateReport:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/reports/generate
            Method: POST
        ListReports:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /students/{id}/reports
            Method: GET
        DownloadReport:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /reports/{reportId}/download
            Method: GET
        DeleteReport:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /reports/{reportId}
            Method: DELETE

  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/audit.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        ChildAudit:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /audit/students/{id}
            Method: GET
        ActorAudit:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /audit
            Method: GET

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handlers/admin.lambdaHandler
      Role: !GetAtt ApiRole.Arn
      Events:
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/users
            Method: GET
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/users/{id}
            Method: PATCH
        ResetPassword:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/users/{id}/password
            Method: POST
        DeleteUser:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/users/{id}
            Method: DELETE

  # ------------------------------------------------------------------------
  # ML inference — Python Lambda with the trained model bundled in the package.
  # Invoked asynchronously (Event) by the Forms handler after a new submission;
  # it scores the answers and writes the PRED# item itself. No SQS, no API.
  # ------------------------------------------------------------------------
  InferenceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: learning-profile-inference-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}

  InferenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/inference/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt InferenceRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTableName

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: learning-profile-api-ApiEndpoint
