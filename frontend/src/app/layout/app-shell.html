<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<mat-toolbar color="primary">
  <button
    mat-icon-button
    (click)="nav.toggle()"
    (keydown.enter)="nav.toggle()"
    aria-label="Abrir menu de navegação"
    *ngIf="isHandset()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title">Perfil de Aprendizado</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #nav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    aria-label="Navegação principal"
  >
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Início
      </a>
      @if (auth.isAuthenticated()) {
        <a mat-list-item routerLink="/perfil" routerLinkActive="active">
          Meu perfil
        </a>
        <a mat-list-item routerLink="/avaliacao" routerLinkActive="active">
          Avaliação
        </a>
        <a mat-list-item routerLink="/recomendacoes" routerLinkActive="active">
          Recomendações
        </a>
        <a mat-list-item routerLink="/relatorios" routerLinkActive="active">
          Relatórios
        </a>
        <a mat-list-item routerLink="/observacoes" routerLinkActive="active">
          Observações
        </a>
        <a mat-list-item (click)="logout()" class="logout-link">Sair</a>
      } @else {
        <a mat-list-item routerLink="/login">Entrar</a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content id="conteudo">
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
