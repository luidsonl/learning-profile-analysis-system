<mat-list>
  @for (bar of bars; track bar.label) {
    <mat-list-item>
      <span class="score-label">{{ bar.label }}</span>
      <mat-progress-bar
        mode="determinate"
        [value]="bar.value"
        aria-label="Pontuação {{ bar.label }}"
      />
      <span class="score-value">{{ bar.display }}</span>
    </mat-list-item>
  }
</mat-list>
